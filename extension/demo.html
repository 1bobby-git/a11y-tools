<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>접근성 테스트용 데모 — 의도적인 오류 포함</title><style>
*{box-sizing:border-box}body{font:15px/1.6 Arial,"Malgun Gothic",sans-serif;margin:0;color:#183129;background:#fff}header{padding:16px 24px;background:#eaf1ec}main{padding:24px;max-width:100%;}h1{font-size:24px;margin:0 0 10px}h3{font-size:18px}button,input,a{margin:5px;padding:10px 15px;font:inherit}button{border:1px solid #587965;background:#edf4ee;border-radius:6px;color:#153f29}input{border:1px solid #738078;border-radius:4px;max-width:90%}section{padding:12px;border:1px solid #ccd7ce;margin-bottom:12px}.broken:focus{width:calc(100vw + 180px);height:90px;outline:none}.layout:focus-within{padding-top:45px}.layout{padding:12px}.sample-image{width:150px;height:30px}video{width:180px;height:40px}.row{display:flex;gap:8px;align-items:center}footer{padding:15px;background:#eaf1ec}
</style></head><body><header>테스트 전용 · 오류가 포함된 예제입니다.</header><main><h1>상품 안내</h1><h3>마크업과 대체 콘텐츠</h3><img class="sample-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4//8/AwAI/AL+XzTnGAAAAABJRU5ErkJggg=="><img alt="" width="24" height="24" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4//8/AwAI/AL+XzTnGAAAAABJRU5ErkJggg=="><button type="button" id="empty-button"><span aria-hidden="true">⌕</span></button><section class="layout"><p>Tab 이동 시 아래 버튼을 지나가면 너비와 주변 레이아웃이 변합니다.</p><button id="normal-focus" type="button">정상 버튼</button><button id="broken-focus" class="broken" type="button">초점을 받으면 화면이 넘치는 버튼</button><input id="unlabelled" placeholder="레이블 없는 입력"></section><section><label for="email">이메일</label><input id="email" type="email"><button id="priority" tabindex="3">양수 tabindex 버튼</button><p id="duplicate">첫 번째 중복 id</p><p id="duplicate">두 번째 중복 id</p><video controls></video><table><tr><td>제품명</td><td>수량</td></tr><tr><td>테스트 상품</td><td>3</td></tr></table></section></main><footer>Tab 순서와 읽기 순서는 따로 확인하세요.</footer></body></html>
