<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>접근성 스튜디오</title><link rel="stylesheet" href="popup.css"><script defer src="popup.js"></script></head><body><h1>접근성 스튜디오</h1><p>현재 탭의 실제 화면을 검사합니다.</p><label for="state-label">화면 상태 이름</label><input id="state-label" placeholder="예: 모바일 메뉴 열림" maxlength="120"><button id="audit" class="primary">이 페이지 검사</button><button id="start-focus">초점 기록 시작</button><button id="stop-focus">중지하고 보고서</button><button id="latest">최근 보고서 열기</button><p class="note">시작 후 페이지에서 Tab / Shift+Tab으로 이동하세요. 가상 커서나 음성을 자동 수집하지 않습니다.</p><div id="status" role="status" aria-live="polite"></div><button id="delete" class="text">저장 보고서 · 기록 삭제</button><p class="note">입력값·쿠키 수집 없음 · 외부 전송 없음<br>chrome:// 등의 특수 페이지는 검사할 수 없습니다.</p></body></html>
